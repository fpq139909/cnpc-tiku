<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>党建云题库 · 手机版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f4f6f9; color: #1f2329; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px 60px; }
  .brand { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 18px;
           background: linear-gradient(135deg, #d4001e, #a0001a);
           display: flex; align-items: center; justify-content: center;
           color: #fff; font-size: 30px; box-shadow: 0 6px 18px rgba(212,0,30,.3); }
  h1 { text-align: center; font-size: 24px; margin-bottom: 6px; }
  .sub { text-align: center; color: #8a9099; font-size: 13px; margin-bottom: 34px; }
  .btn { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #e6e9ef;
         border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; text-decoration: none;
         color: #1f2329; font-size: 17px; font-weight: 600; box-shadow: 0 2px 10px rgba(20,40,80,.04);
         transition: transform .12s, box-shadow .12s; }
  .btn:active { transform: scale(.98); }
  .btn .ico { font-size: 24px; }
  .btn .arrow { margin-left: auto; color: #c0c6d0; font-size: 20px; }
  .foot { text-align: center; color: #aab0bb; font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">党</div>
  <h1>党建云题库</h1>
  <p class="sub">选择科目，点开即可复制题库文本</p>
  <a class="btn" href="view.html?sub=month"><span class="ico">📘</span>月月学<span class="arrow">›</span></a>
  <a class="btn" href="view.html?sub=proj"><span class="ico">📗</span>项目学习<span class="arrow">›</span></a>
  <a class="btn" href="view.html?sub=xxyd"><span class="ico">📙</span>学习用典<span class="arrow">›</span></a>
  <div class="foot">链接长期固定 · 内容由桌面端自动同步</div>
</div>
<script>
// 每次点击都给链接追加时间戳，强制浏览器重新拉取最新的 view.html（避免微信缓存旧页面）
document.querySelectorAll('.btn').forEach(function(a){
  a.addEventListener('click', function(){
    var href = a.getAttribute('href');
    var base = href.split('?')[0];
    var sub = new URLSearchParams(href.split('?')[1] || '').get('sub') || 'month';
    a.href = base + '?sub=' + sub + '&_=' + Date.now();
  });
});
</script>
</body>
</html>
